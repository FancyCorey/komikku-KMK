name: Release build

on:
  push:
    tags: [v*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and sign KMK release
    if: github.repository == 'FancyCorey/komikku-KMK'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Configure Google Drive installed-app client
        shell: bash
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_CLIENT_SECRETS_JSON}"
          mkdir -p app/src/main/assets
          printf '%s' "${GOOGLE_CLIENT_SECRETS_JSON}" > app/src/main/assets/client_secrets.json

      - name: Format, test, and build release
        run: ./gradlew spotlessCheck :app:testDebugUnitTest :source-local:testDebugUnitTest :app:assembleRelease -Penable-updater

      - name: Sign release APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Name signed APKs
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk "Komikku-KMK-${tag}.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk "Komikku-KMK-arm64-v8a-${tag}.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk "Komikku-KMK-armeabi-v7a-${tag}.apk"
          mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk "Komikku-KMK-x86-${tag}.apk"
          mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk "Komikku-KMK-x86_64-${tag}.apk"
          sha256sum Komikku-KMK-*.apk > SHA256SUMS.txt

      - name: Upload release build record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: komikku-kmk-release-${{ github.ref_name }}
          path: |
            Komikku-KMK-*.apk
            SHA256SUMS.txt
            app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: Komikku KMK ${{ github.ref_name }}
          body: |
            This is an independently maintained Komikku KMK release.

            Review the generated notes, APK hashes, and signing certificate before publishing this draft.
          generate_release_notes: true
          files: |
            Komikku-KMK-*.apk
            SHA256SUMS.txt
          draft: true
          prerelease: false
