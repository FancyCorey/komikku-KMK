name: Issue report
description: Report a reproducible issue in Komikku KMK
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reliably shows the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: If the app crashes, use More > Settings > Advanced > Dump crash logs. Check the file for private information before attaching it.

  - type: input
    id: komikku-version
    attributes:
      label: Komikku KMK version
      description: Find this in More > About.
      placeholder: Example: 1.14.1
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Example: Android 15
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Give the manufacturer and model. Do not include a serial number or account identifier.
      placeholder: Example: Google Pixel 9
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      description: Add privacy-safe screenshots or context when useful.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and did not find the same report.
          required: true
        - label: I reviewed the public [user guide](https://github.com/FancyCorey/komikku-KMK/blob/master/docs/kmk/user-guide.md).
          required: true
        - label: I tested the latest [Komikku KMK release](https://github.com/FancyCorey/komikku-KMK/releases/latest).
          required: true
        - label: I removed credentials, private library content, raw source URLs, storage paths, and device identifiers from attachments.
          required: true
        - label: I understand that this project does not maintain third-party sources or extensions.
          required: true

  - type: textarea
    id: prioritisation
    attributes:
      label: Is this issue important to you?
      description: Please leave this text unchanged so other users can vote consistently.
      value: |
        Add a :+1: [reaction] if this issue is important to you.

        [reaction]: https://github.blog/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/
