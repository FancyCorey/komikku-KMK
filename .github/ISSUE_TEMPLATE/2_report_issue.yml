name: Issue report
description: Report a reproducible issue in Komikku KMK
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reliably shows the issue. Include the starting screen and any setting needed to reproduce it.
      placeholder: |
        Example:
          1. Open ...
          2. Select ...
          3. Observe the issue ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen after following the steps above.
      placeholder: |
        Example:
          "The app should ..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what happened instead. Include whether the issue happens every time or only sometimes.
      placeholder: |
        Example:
          "Instead, the app ..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: |
        If the app crashes, go to **More → Settings → Advanced**, select **Dump crash logs**, and attach the resulting file when possible.

        Read the file before uploading it. Remove account details, source URLs, local paths, manga or chapter names, and anything else you do not want to publish.
      placeholder: Upload the checked crash-log file, or paste only the relevant privacy-safe section.

  - type: input
    id: komikku-version
    attributes:
      label: Komikku KMK version
      description: Find the complete version in **More → About**. Preview and commit identifiers are useful when shown there.
      placeholder: 'Example: "1.14.1"'
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Find this in your device's Android settings.
      placeholder: 'Example: "Android 15"'
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Give the manufacturer and model, but do not include a serial number or account identifier.
      placeholder: 'Example: "Google Pixel 9"'
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      description: Add screenshots, screen recordings, frequency, recent changes, or other context that can help reproduce the issue.
      placeholder: |
        Add supporting details or attachments here.

        Before uploading, hide account details, source names, library activity, local paths, notifications, and other private information.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: These checks prevent duplicate reports and make sure maintainers have enough information to investigate.
      options:
        - label: I searched open and closed issues and did not find the same report or an issue that should receive this information instead.
          required: true
        - label: I wrote a short but informative title.
          required: true
        - label: I reviewed the [KMK user guide](https://github.com/FancyCorey/komikku-KMK/blob/master/docs/kmk/user-guide.md) and, for inherited Komikku behavior, the upstream [FAQ](https://komikku-app.github.io/docs/faq/general) and [troubleshooting guide](https://komikku-app.github.io/docs/guides/troubleshooting/).
          required: true
        - label: I tested the latest [Komikku KMK release](https://github.com/FancyCorey/komikku-KMK/releases/latest).
          required: true
        - label: I filled out every relevant field, including the complete app, Android, and device versions.
          required: true
        - label: I checked attachments and removed credentials, private library content, raw source URLs, storage paths, and device identifiers.
          required: true
        - label: I understand that KMK can investigate app behavior around extensions, but this project does not maintain third-party source services or their content.
          required: true

  - type: textarea
    id: prioritisation
    attributes:
      label: Is this issue important to you?
      description: |
        **Please do not modify this text area.**

        Other users can add a :+1: reaction to show that the issue affects them. Reactions do not guarantee fix order, but they help maintainers understand impact. If an existing report describes the same problem, react to it and add reproducible details there instead of opening a duplicate.
      value: |
        Add a :+1: [reaction] to [issues you find important].

        [reaction]: https://github.blog/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/
        [issues you find important]: https://github.com/FancyCorey/komikku-KMK/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc
