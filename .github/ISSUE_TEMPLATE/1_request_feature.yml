name: Feature request
description: Suggest a feature to improve Komikku KMK
labels: [feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: Explain the problem and how Komikku KMK could improve it.
      placeholder: Describe the current experience and the result you would prefer.
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      description: Add examples or privacy-safe images when useful.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I wrote a short, informative title and included the relevant context.
          required: true
        - label: I tested the latest [Komikku KMK release](https://github.com/FancyCorey/komikku-KMK/releases/latest).
          required: true

  - type: textarea
    id: prioritisation
    attributes:
      label: Is this issue important to you?
      description: Please leave this text unchanged so other users can vote consistently.
      value: |
        Add a :+1: [reaction] if this request is important to you.

        [reaction]: https://github.blog/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/
